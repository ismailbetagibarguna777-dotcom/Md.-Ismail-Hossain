name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple rapid commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies 📦
        run: npm ci || npm install

      - name: Build 🏗️
        run: npm run build
        env:
          # If you deploy your serverless backend to Vercel/Netlify, 
          # you can set VITE_API_URL in your GitHub Repository Secrets 
          # to point to your free backend, e.g. https://my-backend.vercel.app
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder the action should deploy.
          branch: gh-pages # The branch the action should deploy to.
